env=prod
stage=prod

delay.milliseconds=0

block.on.missing.origin.referer=false
heartbeat.id=ueberschreiben

target.origin=mathe-jung-alt.de

dir.einkaufslisten=/usr/local/bin/checklisten/ext-config/einkaufslisten
dir.packlisten=/usr/local/bin/checklisten/ext-config/packlisten

## authprovider
auth.client-id=ueberschreiben
auth.client-secret=ueberschreiben

auth-app.url=https://mathe-jung-alt.de/authprovider/
auth.redirect-url.login=https://mathe-jung-alt.de/checklistenapp#/listen
auth.redirect-url.signup=https://mathe-jung-alt.de/checklistenapp

# --------------------------------------------------------------------------------
#           RestClients
# --------------------------------------------------------------------------------
## authprovider
quarkus.rest-client.authprovider.url=https://mathe-jung-alt.de/authprovider
quarkus.rest-client.authprovider.scope=ApplicationScoped
quarkus.rest-client.authprovider.connect-timeout=5000
quarkus.rest-client.authprovider.read-timeout=30000

# --------------------------------------------------------------------------------
#           Database
# --------------------------------------------------------------------------------
quarkus.datasource.devservices.enabled=false
quarkus.datasource.db-kind=mariadb
quarkus.datasource.jdbc.url=jdbc:mariadb://checklisten-database:3306/checklisten
quarkus.datasource.username=chklst
quarkus.datasource.password=ueberschreiben
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.packages=de.egladil.web.checklistenserver.infrastructure.persistence.entities
quarkus.hibernate-orm.dialect=org.hibernate.dialect.MariaDBDialect

# --------------------------------------------------------------------------------
#           Logging
# --------------------------------------------------------------------------------
quarkus.log.min-level=INFO

quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %p (%t) clientId=%X{clientId}, correlationId=%X{correlationId}, [%c:%L] %s%e%n
quarkus.log.console.level=INFO

quarkus.hibernate-orm.log.bind-parameters=false
quarkus.hibernate-orm.log.sql=false

quarkus.log.file.enable=true
quarkus.log.file.level=INFO
quarkus.log.file.path=/deployments/logs/server.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %p (%t) clientId=%X{clientId}, correlationId=%X{correlationId}, [%c:%L] %s%e%n
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd

quarkus.http.access-log.enabled=true
quarkus.http.record-request-start-time=true
quarkus.http.access-log.pattern=%h %l %u [%t] "%r" %s %b "%{i,Referer}" "%{i,User-Agent}" %D "%{i,X-CLIENT-ID}" "%{i,X-CORRELATION-ID}"
quarkus.http.access-log.log-to-file=true
quarkus.http.access-log.base-file-name=access
quarkus.http.access-log.log-directory=/deployments/logs
quarkus.http.access-log.rotate=true

quarkus.log.category."org.hibernate".level=ERROR
quarkus.log.category."io.quarkus.hibernate.orm".level=ERROR

quarkus.log.category."de.egladil.web.checklistenserver.infrastructure.filters".level=ERROR


# Http
quarkus.http.port=9300

quarkus.http.cors=true
quarkus.http.cors.origins=https://mathe-jung-alt.de
quarkus.http.cors.methods=POST, PUT, GET, HEAD, OPTIONS, DELETE
quarkus.http.cors.headers=Content-Type, Accept, X-Requested-With, Content-Disposition, X-XSRF-TOKEN, X-SESSIONID
quarkus.http.cors.exposed-headers=Content-Type,Content-Disposition,X-XSRF-TOKEN
quarkus.http.cors.access-control-max-age=6H

# JWT
mp.jwt.verify.publickey.location=META-INF/authprov_public_key.pem
mp.jwt.verify.issuer=heike2718/authprovider
